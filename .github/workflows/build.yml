name: Build Galaxy Android

on:
  workflow_dispatch:   # 允许你手动触发构建
    inputs:
      commit_sha:
        description: 'Commit SHA to build'
        required: true
        default: 'c938c20aa131bccc052f55e39b51fa0d7b2417d5' # 预填你指定的 Commit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.commit_sha }} # 关键：锁定到指定的 Commit

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: galaxy-android-debug-apk
        path: app/build/outputs/apk/debug/*.apk
